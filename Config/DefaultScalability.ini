; Tartarus Arena scalability (measured at 1600x900 on an RTX 3070, editor -game, bot match, csvprofile):
; Epic with the engine's Lumen 17.3 ms a frame, without Lumen 12.6 ms. A MOBA needs its frame rate, so:
;   Epic  = Lumen global illumination and reflections, trimmed where this sunny outdoor arena gains little
;   High  = everything else (exposure, local exposure, distance-field AO and shadows, contact shadows, fog), no Lumen
[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=0

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=0

[GlobalIlluminationQuality@3]
; lit translucency is rare here (the Paragon effects are mostly unlit): no Lumen translucency volume (~0.5 ms)
r.Lumen.TranslucencyVolume.Enable=0
; off-screen shadowing of the Lumen scene from the global distance field, not every mesh's (~0.5 ms)
r.LumenScene.DirectLighting.OffscreenShadowing.TraceMeshSDFs=0
; short-range AO at half resolution (~0.3 ms)
r.Lumen.ScreenProbeGather.ShortRangeAO.DownsampleFactor=2

; the texture pool: the Paragon heroes, the Agora / Monolith sets and the kite-demo trees need ~1.3 GB in a 5v5 fight
; (the editor reported the engine's 1000 MB Epic pool 268 MB over budget: mips dropped, blurry faces). Raised, clamped to the
; card's memory so a smaller GPU is not overcommitted.
[TextureQuality@2]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1300

[TextureQuality@3]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1600
